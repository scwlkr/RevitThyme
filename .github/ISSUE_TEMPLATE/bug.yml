name: Bug report
description: Report unexpected RevitThyme behavior
body:
  - type: dropdown
    id: interface
    attributes:
      label: Affected interface
      options:
        - Native ribbon / WPF
        - CLI
        - MCP / external agent
        - Built-in Agent
        - Installer / updates
        - Website / documentation
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: RevitThyme and Windows versions; exact Revit build and runtime if relevant. Website-only reports do not require Revit.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and expected behavior
      description: Use a small public sample. Omit private models, names, paths and credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant operation status and diagnostics.
