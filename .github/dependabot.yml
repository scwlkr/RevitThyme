version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns: ['@docusaurus/*']
      react:
        patterns: ['react', 'react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
