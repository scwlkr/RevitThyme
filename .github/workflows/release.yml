name: Foundation CLI artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned .NET SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -Version 10.0.400 -InstallDir "$env:RUNNER_TEMP/dotnet"
          "$env:RUNNER_TEMP/dotnet" | Out-File -FilePath $env:GITHUB_PATH -Append
          "DOTNET_ROOT=$env:RUNNER_TEMP/dotnet" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify portable foundation
        run: .\project.cmd check -Portable
      - name: Publish framework-dependent CLI artifact
        run: dotnet publish src/RevitThyme.Cli -c Release --no-self-contained -o artifacts/cli
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: foundation-cli
          path: artifacts/cli/
