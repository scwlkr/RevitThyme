name: Publish versioned release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check tag and package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content suite.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and suite version differ' }
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must already exist' }
          .\project.cmd check-public-ci
          if ($LASTEXITCODE -ne 0) { throw 'Release checks failed' }
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content suite.json -Raw | ConvertFrom-Json).version
          gh release create "$env:RELEASE_TAG" packages/*.zip packages/*.sha256 --verify-tag --prerelease --title "RevitThyme $env:RELEASE_TAG" --notes-file "docs/RELEASE-NOTES-$version.md" --generate-notes
