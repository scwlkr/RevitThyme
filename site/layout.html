<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>@@TITLE@@</title><meta name="description" content="@@DESCRIPTION@@">
  <meta name="theme-color" content="#183f35"><link rel="canonical" href="@@CANONICAL@@">
  <meta property="og:type" content="website"><meta property="og:title" content="@@TITLE@@">
  <meta property="og:description" content="@@DESCRIPTION@@"><meta property="og:url" content="@@CANONICAL@@">
  <link rel="icon" href="/assets/status.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/docs.css">

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="/" aria-label="RevitThyme home"><img src="/assets/revitthyme-logo.svg" alt="RevitThyme" width="194" height="58"></a>
    <a class="header-version" href="/docs/changelog/">v0.2.0 preview</a>
    <button class="search-trigger" data-open-search>Search docs <kbd>Ctrl K</kbd></button>
  </div><div class="header-nav"><nav id="site-nav" aria-label="Main navigation">
      <a href="/" @@HOME_ACTIVE@@>Home</a><a href="/download/" @@DOWNLOAD_ACTIVE@@>Download</a>
      <a href="/docs/" @@DOCS_ACTIVE@@>Documentation</a><a href="https://github.com/scwlkr/RevitThyme">GitHub <span aria-hidden="true">↗</span></a>

  <dialog id="search-dialog" aria-labelledby="search-title"><div class="search-top"><h2 id="search-title">Search docs</h2><button data-close-search aria-label="Close search">×</button></div>
    <label class="sr-only" for="search-input">Search query</label><input id="search-input" type="search" placeholder="Search docs…" autocomplete="off">
    <p id="search-status" class="small" role="status" aria-live="polite"></p><div id="search-results"></div>
  </dialog>
</body>
</html>
